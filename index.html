<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Desafios matemáticos inspirados na trajetória de Katherine Johnson.">
    <title>Cartas da Precisão | Katherine Johnson</title>

    <!-- Funciona no GitHub Pages, mas depende de internet para carregar o Tailwind. -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        espaco: '#0b0e27',
                        estrela: '#f9d71c',
                        nasaAzul: '#0f4c81'
                    }
                }
            }
        };
    </script>

    <style type="text/tailwindcss">
        @layer utilities {
            .container-cartas {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 1rem;
                padding: 1rem;
            }

            .carta {
                height: 260px;
                position: relative;
                cursor: pointer;
                perspective: 1000px;
            }

            .carta-interno {
                position: relative;
                width: 100%;
                height: 100%;
                text-align: center;
                transition: transform 0.6s ease;
                transform-style: preserve-3d;
            }

            .carta.virada .carta-interno {
                transform: rotateY(180deg);
                cursor: default;
            }

            .carta-frente,
            .carta-verso {
                position: absolute;
                width: 100%;
                height: 100%;
                -webkit-backface-visibility: hidden;
                backface-visibility: hidden;
                border-radius: 1rem;
                padding: 1rem;
                box-sizing: border-box;
            }

            .carta-frente {
                background: linear-gradient(135deg, #0f4c81 0%, #1a237e 100%);
                border: 3px solid #f9d71c;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                color: white;
                font-weight: bold;
                font-size: 1.2rem;
                gap: 1rem;
                box-shadow: 0 4px 15px rgba(249, 215, 28, 0.25);
            }

            .carta-frente i {
                font-size: 3rem;
                color: #f9d71c;
            }

            .carta-verso {
                background: #f8fafc;
                color: #0f172a;
                transform: rotateY(180deg);
                border: 3px solid #0f4c81;
                display: flex;
                flex-direction: column;
                justify-content: center;
                overflow-y: auto;
            }

            .btn-verificar {
                background: #0f4c81;
                color: white;
                padding: 7px 14px;
                border-radius: 6px;
                margin-top: 10px;
                font-weight: bold;
                border: none;
                cursor: pointer;
                transition: background 0.2s;
            }

            .btn-verificar:hover {
                background: #1e40af;
            }

            .btn-verificar:disabled {
                cursor: not-allowed;
            }

            .correto {
                color: green;
                font-weight: bold;
                margin-top: 8px;
                font-size: 1.05rem;
            }

            .errado {
                color: red;
                font-weight: bold;
                margin-top: 8px;
                font-size: 1.05rem;
            }

            .entrada-resposta {
                max-width: 85%;
                padding: 8px;
                border: 2px solid #93c5fd;
                border-radius: 6px;
                font-size: 1rem;
                text-align: center;
                margin: 5px auto 0;
            }
        }
    </style>
</head>
<body class="bg-espaco text-white min-h-screen">
    <main class="container mx-auto px-4 py-8 max-w-7xl">
        <header class="text-center mb-10">
            <h1 class="text-[clamp(1.8rem,5vw,3rem)] font-bold text-estrela mb-3">
                <i class="fa fa-star mr-3" aria-hidden="true"></i>Desafios com Katherine Johnson
            </h1>
            <p class="text-lg text-blue-200">Clique na carta, responda e confira sua resposta.</p>
            <button id="btnReiniciar" type="button" class="mt-4 bg-estrela text-espaco px-6 py-2 rounded-lg font-bold hover:bg-yellow-400 transition">
                Reiniciar e embaralhar
            </button>
        </header>

        <section id="gradeCartas" class="container-cartas" aria-label="Cartas de desafios"></section>
    </main>

    <script>
        const listaDesafios = [
            { titulo: 'Velocidade Orbital', pergunta: 'Uma nave percorre 48 km em 6 segundos. Qual sua velocidade média em km/s?', resposta: 8 },
            { titulo: 'Órbitas da Terra', pergunta: 'Cada volta ao redor da Terra dura 90 minutos. Quantas órbitas completas em 5 horas?', resposta: 3 },
            { titulo: 'Distância até a Lua', pergunta: 'A distância média até a Lua é 384.000 km. Qual é a metade dessa distância em km?', resposta: 192000 },
            { titulo: 'Sincronia de Antenas', pergunta: 'Uma antena envia sinal a cada 4 minutos, outra a cada 6 minutos. Qual o menor tempo em que enviam juntas (min)?', resposta: 12 },
            { titulo: 'Combustível', pergunta: 'Gasta 12 toneladas por minuto. Quantas toneladas em 7 minutos de subida?', resposta: 84 },
            { titulo: 'Viagem Espacial', pergunta: 'Viajando a 11 km/s, quantos km percorre em 9 segundos?', resposta: 99 },
            { titulo: 'Divisão de Dados', pergunta: '720 medições para dividir igualmente entre 8 equipes. Quantos dados cada uma recebe?', resposta: 90 },
            { titulo: '100 Anos', pergunta: 'Katherine nasceu em 1918. Quantos anos completou em 2018?', resposta: 100 },
            { titulo: 'Total de Missões', pergunta: 'Calculou 15 missões pequenas e 27 grandes. Quantas ao todo?', resposta: 42 },
            { titulo: 'Redução de Erros', pergunta: 'De 12 erros caiu para 3. Quantos eliminou?', resposta: 9 },
            { titulo: 'Redução de Velocidade', pergunta: 'De 11 km/s deve baixar para 7 km/s. Quantos reduzir?', resposta: 4 },
            { titulo: 'Horas de Trabalho', pergunta: 'Trabalhou 6h por dia durante 5 dias. Total de horas?', resposta: 30 },
            { titulo: 'Velocidade Rápida', pergunta: 'Percorre 720 km por minuto. Quantos km em 5 minutos?', resposta: 3600 },
            { titulo: 'Etapas da Viagem', pergunta: '4.500 km divididos em 5 partes iguais. Cada parte tem quantos km?', resposta: 900 },
            { titulo: 'Anos de Reconhecimento', pergunta: 'Começou em 1953 e ganhou medalha em 2015. Quantos anos depois?', resposta: 62 },
            { titulo: 'Ângulo de Lançamento', pergunta: 'Ideal 60°, usou 52°. Faltou quantos graus?', resposta: 8 }
        ];

        const grade = document.getElementById('gradeCartas');
        const btnReiniciar = document.getElementById('btnReiniciar');

        function embaralhar(lista) {
            return [...lista].sort(() => Math.random() - 0.5);
        }

        function criarCartas() {
            grade.innerHTML = '';

            embaralhar(listaDesafios).forEach((desafio, indice) => {
                const carta = document.createElement('div');
                carta.className = 'carta';
                carta.resolvida = false;

                carta.innerHTML = `
                    <div class="carta-interno">
                        <div class="carta-frente">
                            <i class="fa fa-rocket" aria-hidden="true"></i>
                            <span>Katherine Johnson</span>
                        </div>
                        <div class="carta-verso">
                            <strong>${desafio.titulo}</strong><br><br>
                            <span>${desafio.pergunta}</span>
                            <label class="sr-only" for="resp-${indice}">Sua resposta</label>
                            <input class="entrada-resposta" type="number" inputmode="numeric" placeholder="Sua resposta..." id="resp-${indice}">
                            <button class="btn-verificar" type="button">Verificar</button>
                            <div class="mensagem" role="status" aria-live="polite"></div>
                        </div>
                    </div>
                `;

                const input = carta.querySelector('input');
                const botao = carta.querySelector('.btn-verificar');

                botao.addEventListener('click', () => verificar(botao, desafio.resposta, carta));
                input.addEventListener('keydown', (evento) => {
                    if (evento.key === 'Enter') verificar(botao, desafio.resposta, carta);
                });

                carta.addEventListener('click', (evento) => {
                    if (!carta.classList.contains('virada') && !carta.resolvida && !evento.target.closest('input, button')) {
                        carta.classList.add('virada');
                        input.focus();
                    }
                });

                grade.appendChild(carta);
            });
        }

        function verificar(botao, respostaCorreta, elementoCarta) {
            const input = elementoCarta.querySelector('input');
            const mensagem = elementoCarta.querySelector('.mensagem');
            const valor = Number(input.value);

            if (input.value.trim() === '' || !Number.isFinite(valor)) {
                mensagem.textContent = 'Digite um número válido.';
                mensagem.className = 'errado';
                return;
            }

            if (valor === respostaCorreta) {
                mensagem.textContent = `Correto! Valor: ${respostaCorreta}`;
                mensagem.className = 'correto';
                botao.disabled = true;
                input.disabled = true;
                elementoCarta.resolvida = true;
            } else {
                mensagem.textContent = 'Resposta incorreta. Tente novamente.';
                mensagem.className = 'errado';
            }
        }

        btnReiniciar.addEventListener('click', criarCartas);
        criarCartas();
    </script>
</body>
</html>
